name: Android uygulaması

# android/ klasörü değişince APK'yı derler ve "Android uygulaması" sürümüne yükler.
# İndirme linki: https://github.com/oktan-co/gorev-takip/releases/download/android/Gorevler.apk
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK'yı derle
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          set +e
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > release.jks
          else
            echo "::warning title=İmza anahtarı yok::ANDROID_KEYSTORE gizli ayarı eklenmemiş; bu APK geçici anahtarla imzalandı."
          fi
          gradle assembleRelease --no-daemon -Pvcode=${{ github.run_number }} > build.log 2>&1
          code=$?
          tail -n 40 build.log
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error:|^e: |What went wrong|FAILURE|Could not|> " build.log | head -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Derleme hatası::$msg"
            exit 1
          fi

      - name: Sürüme yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Gorevler.apk
          notes="Sürüm 1.${{ github.run_number }} · $(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M')"
          if gh release view android > /dev/null 2>&1; then
            gh release upload android Gorevler.apk --clobber
            gh release edit android --notes "$notes"
          else
            gh release create android Gorevler.apk --title "Görevler Android uygulaması" --notes "$notes" --latest
          fi
          echo "::notice title=APK hazır::Sürüm 1.${{ github.run_number }}"
