<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<title>Görevlerim</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div id="loginScreen" class="login-screen">
  <form id="loginForm" class="login-box" autocomplete="on">
    <div class="login-logo">G</div>
    <h1>Görevlerim</h1>
    <p class="login-sub">Devam etmek için giriş yap</p>
    <label class="field">
      <span>Kullanıcı adı</span>
      <input id="loginUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </label>
    <label class="field">
      <span>Şifre</span>
      <input id="loginPass" type="password" autocomplete="current-password" required>
    </label>
    <div id="loginError" class="form-error" hidden></div>
    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Giriş yap</button>
  </form>
</div>

<!-- YÜKLENİYOR -->
<div id="bootScreen" class="boot-screen"><div class="spinner"></div></div>

<!-- UYGULAMA -->
<div id="app" class="app" hidden>

  <div id="scrim" class="scrim"></div>

  <!-- YAN MENÜ -->
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <div class="avatar" id="sideAvatar">A</div>
      <div class="side-head-text">
        <div class="side-name" id="sideName">admin</div>
        <div class="side-role" id="sideRole">Yönetici</div>
      </div>
      <button class="icon-btn" id="closeSide" aria-label="Menüyü kapat">
        <svg viewBox="0 0 24 24" class="ic"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <nav class="smart-views" id="smartViews"></nav>

    <div class="side-section-head">
      <span>Listeler</span>
      <button class="text-btn" id="addGroupBtn">+ Grup</button>
    </div>

    <div id="listTree" class="list-tree"></div>

    <button class="side-add" id="addListBtn">
      <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
      Yeni liste
    </button>

    <div class="side-foot">
      <button class="side-foot-btn" id="settingsBtn">
        <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>
        Ayarlar
      </button>
      <button class="side-foot-btn" id="logoutBtn">
        <svg viewBox="0 0 24 24" class="ic"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Çıkış
      </button>
    </div>
  </aside>

  <!-- ANA ALAN -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="openSide" aria-label="Menü">
        <svg viewBox="0 0 24 24" class="ic"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-title">
        <h2 id="viewTitle">Bugün</h2>
        <p id="viewSub"></p>
      </div>
      <button class="icon-btn" id="searchBtn" aria-label="Ara">
        <svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="icon-btn" id="listMenuBtn" aria-label="Liste ayarları" hidden>
        <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
      </button>
    </header>

    <div id="searchBar" class="search-bar" hidden>
      <input id="searchInput" type="search" placeholder="Görevlerde ara...">
      <button class="text-btn" id="searchClose">Kapat</button>
    </div>

    <div id="updateBanner" class="banner" hidden></div>
    <div id="reminderBanner" class="banner" hidden></div>

    <div id="content" class="content"></div>

    <div class="composer" id="composer">
      <button class="composer-add" id="composerAdd" aria-label="Görev ekle">
        <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <input id="composerInput" type="text" placeholder="Yeni görev ekle">
      <button class="composer-date" id="composerDate" aria-label="Tarih">
        <svg viewBox="0 0 24 24" class="ic"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span id="composerDateLabel">Tarihsiz</span>
      </button>
    </div>
  </main>
</div>

<!-- GÖREV DETAY PANELİ -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-body">
    <div class="sheet-head">
      <button class="text-btn" data-close>Kapat</button>
      <span id="sheetTitle">Görev</span>
      <button class="text-btn danger" id="sheetDelete">Sil</button>
    </div>
    <div class="sheet-content" id="sheetContent"></div>
  </div>
</div>

<!-- GENEL DİYALOG -->
<div id="dialog" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-body sheet-small">
    <div class="sheet-head">
      <button class="text-btn" data-close>İptal</button>
      <span id="dialogTitle"></span>
      <button class="text-btn primary" id="dialogOk">Tamam</button>
    </div>
    <div class="sheet-content" id="dialogContent"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
